<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- App identity -->
    <title>ZIKUK</title>
    <meta name="description" content="Your calm daily operating layer. Capture thoughts, choose priorities, focus with momentum." />
    <meta name="application-name" content="ZIKUK" />

    <!-- Theme & display -->
    <meta name="theme-color" content="#000119" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZIKUK" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="ZIKUK" />
    <meta property="og:description" content="Capture → Choose → Focus. Your calm daily operating layer." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Preconnect to Google Fonts (used in app) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent FOUC: set dark background instantly before JS loads -->
    <style>
      html, body, #root {
        background-color: #000119;
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        /* Prevent any element from causing viewport-level horizontal scroll.
           All scrolling in this SPA is within explicit overflow containers. */
        overflow-x: hidden;
      }
      /* iOS safe area padding */
      body {
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Vercel preview toolbar (injected on *.vercel.app) — not part of the app */
      vercel-live-feedback,
      [data-vercel-toolbar],
      #vercel-toolbar,
      iframe[src*="vercel.live"] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
